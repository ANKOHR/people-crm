[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "people-crm"
version = "0.1.0"
description = "Deterministic local context and follow-up tracking"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pc = "people_crm.cli:main"

[tool.setuptools.packages.find]
include = ["people_crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
